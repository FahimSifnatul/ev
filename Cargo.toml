[package]
name = "ev"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Manage permanent environment variables from one command"
repository = "https://github.com/FahimSifnatul/ev"
homepage = "https://github.com/FahimSifnatul/ev"
readme = "README.md"
keywords = ["environment", "env", "cli", "shell", "variables"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
